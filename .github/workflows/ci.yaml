name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - hday-*
    paths: &paths
      - .github/workflows/ci.yaml
      - cmd/**
      - internal/**
      - scripts/**
      - docker-bake.hcl
      - Dockerfile
      - go.mod
      - go.sum
      - main.go
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO: ghcr.io/${{ github.repository }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
      BUILD_HASH: ${{ github.sha }}
      BUILD_ID: r${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/bake-action@v7
        with:
          source: .
          targets: test,build
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Login to GHCR
        uses: docker/login-action@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/hday-'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        uses: docker/bake-action@v7
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/hday-'))
        with:
          source: .
          targets: app
          set: |
            app.platform=linux/amd64,linux/arm64
            app.output=type=registry

      - name: Record image digest
        if: steps.push.outcome == 'success'
        env:
          BAKE_METADATA: ${{ steps.push.outputs.metadata }}
        run: |
          digest=$(jq -r '.app["containerimage.digest"]' <<< "$BAKE_METADATA")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "${REPO}:${TAG}@${digest}" >> "$GITHUB_STEP_SUMMARY"
